name: Build Windows Wheels

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-windows-wheels:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
        cuda-version: ['11.8', '12.1']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install CUDA Toolkit ${{ matrix.cuda-version }}
      uses: Jimver/cuda-toolkit@v0.2.14
      id: cuda-toolkit
      with:
        cuda: ${{ matrix.cuda-version }}
        method: 'network'
        sub-packages: '["nvcc", "cudart", "nvrtc_dev", "cublas_dev", "cufft_dev", "curand_dev", "cusolver_dev", "cusparse_dev"]'
    
    - name: Verify CUDA installation
      run: |
        nvcc --version
        echo "CUDA_PATH=$env:CUDA_PATH"
        echo "CUDA_HOME=$env:CUDA_HOME"
    
    - name: Install PyTorch with CUDA ${{ matrix.cuda-version }}
      run: |
        if ("${{ matrix.cuda-version }}" -eq "11.8") {
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118
        } elseif ("${{ matrix.cuda-version }}" -eq "12.1") {
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
        }
    
    - name: Install build dependencies
      run: |
        pip install wheel setuptools
        pip install trimesh
    
    - name: Build wheel
      env:
        CUDA_HOME: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
        FORCE_CUDA: "1"
      run: |
        python setup.py bdist_wheel
    
    - name: List built wheels
      run: |
        Get-ChildItem -Path dist -Filter *.whl
    
    - name: Upload wheels as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: diso-windows-amd64-py${{ matrix.python-version }}-cuda${{ matrix.cuda-version }}-wheel
        path: dist/*.whl
        retention-days: 30
    
    - name: Test wheel installation
      run: |
        pip install (Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1).FullName
        python -c "import diso; print('DISO imported successfully')"
